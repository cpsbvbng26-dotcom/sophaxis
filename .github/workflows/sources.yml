name: sources
# The primary texts that the legal pages cite are fetched (tools/sources.js) and written to verification/sources-raw.json,
# on a new branch sources/<date>, never on main. Run by hand. The operator reads what was fetched before any quotation
# in verification/sources.json is taken from it, and brings it in by a pull request of its own.
# With `only`, just the keys named (or "new": the keys not yet in the file) are fetched, and the rest of the file is kept.
# Laws are kept whole. Every other text is committed only as its address, day, SHA-256 and the parts quoted or relied on;
# the whole texts of the run (verification/sources-full.json) are kept as an artifact of the run, never committed.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Keys to fetch again, comma-separated, or "new"; empty fetches everything'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  fetch:
    name: Fetch the cited texts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: sudo apt-get install -y -q poppler-utils > /dev/null
      - run: node tools/sources.js
        env:
          SOURCES_ONLY: ${{ inputs.only }}
      - run: node tools/sources.js verify
      - run: |
          node -e '
          const f = require("./verification/sources-full.json"); const r = require("./verification/sources-raw.json"); const ks = (process.env.SOURCES_ONLY || "").split(",").map((x) => x.trim());
          for (const k of ks) { const p = (f.pages || {})[k]; const q = (r.pages || {})[k] || {}; console.log("=====PAGE " + k + " " + q.status + " " + (q.final || q.url) + " " + (p ? (p.text || "").length : "none") + (q.tried ? " TRIED " + JSON.stringify(q.tried) : "")); if (p && p.links) console.log("LINKS " + JSON.stringify(p.links)); if (p && p.text) for (let i = 0; i < p.text.length; i += 400) console.log("|" + p.text.slice(i, i + 400)); }'
        env:
          SOURCES_ONLY: ${{ inputs.only }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sources-full
          path: verification/sources-full.json
          retention-days: 90
          if-no-files-found: error
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/sources-raw.json
          git commit -m "Sources: the fetched texts" || exit 0
          echo "probe: not pushed"
