name: sources
# Probe (2026-11-13): compares Vercel's pages fetched now with the texts recorded on main, from the artifacts of earlier
# runs, and prints the differences to the log. Not to be merged. Nothing is pushed.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    name: Probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p arts
          for id in 43336679823 43332663139 43308656854 43308144509 43301977313 43300228531 43274367372 43261089424 43250860786 43250117000; do
            gh run download $id -R ${{ github.repository }} -n sources-full -D arts/$id > /dev/null 2>&1 || echo "no artifact $id"
          done
          node probe.js
