name: report
# Each January, the decisions of the year before are counted from the public issues and the records (tools/report.js),
# and posted in an issue. The operator records them in data/reports/ by pull request; decisions.html shows them.
on:
  schedule:
    - cron: '23 3 2 1 *'
  workflow_dispatch:
    inputs:
      year:
        description: The year to count, such as 2026
        required: false
permissions:
  contents: read
  issues: write
jobs:
  report:
    name: Count the decisions of a year
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The year reaches the script only through the environment, and is checked to be four digits.
      - run: node tools/report_issue.js
        env:
          YEAR: ${{ inputs.year }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
