name: pdf
# Copy the PDFs of a listed record from its repository, on a branch of its own.
# The branch is reviewed and merged through a pull request like any other change.
on:
  workflow_dispatch:
    inputs:
      id:
        description: Record id, such as 2026.0001
        required: true
      from:
        description: Only where the repository does not let a script fetch the file — the PDF the authors attached to their submission issue (https://github.com/user-attachments/…)
        required: false
      version:
        description: With "from" — the version number that the attached PDF is
        required: false
permissions:
  contents: write
jobs:
  pdf:
    name: Copy the PDFs of one record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The id reaches the shell only through the environment, and fetch_pdf.js checks its form.
      - run: |
          if [ -n "$FROM" ]; then node tools/fetch_pdf.js "$ID" --from "$FROM" --version "$VERSION"; else node tools/fetch_pdf.js "$ID"; fi
          node build.js && node verification/check.js
        env:
          ID: ${{ inputs.id }}
          FROM: ${{ inputs.from }}
          VERSION: ${{ inputs.version }}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "claude/pdf-$ID"
          git add data
          git diff --cached --quiet && { echo 'nothing new to copy'; exit 0; }
          git commit -q -m "$ID の PDF を預け先から写す（変更なし）" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01QqWsm63g52W27jU94E5dfL"
          git add site
          git commit -q -m "サイトを生成し直す（生成物、$ID の PDF）" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01QqWsm63g52W27jU94E5dfL"
          git push origin "claude/pdf-$ID"
        env:
          ID: ${{ inputs.id }}
