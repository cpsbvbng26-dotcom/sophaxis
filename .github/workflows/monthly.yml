name: monthly
# On the 1st of each month at 09:17 Japan time, the summary of the month before for the official account on X is posted in an
# issue (tools/monthly.js). The operator copies it; nothing is posted to X automatically.
on:
  schedule:
    - cron: '17 0 1 * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  monthly:
    name: The summary of the month before
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node tools/monthly.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Whether Sophaxis still fits its free services: an issue only at 80 percent of a limit.
      - run: node tools/limits.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
