name: check
on: [push, pull_request]
jobs:
  check:
    name: Records and site
    runs-on: ubuntu-latest
    steps:
      # The whole history: the check confirms that no Sophaxis id was ever given to a second work.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node verification/check.js

  # A browser is needed here, so it is a job of its own: a failure of the browser is then not mistaken for a fault of the site.
  keyboard:
    name: Keyboard and layout
    # playwright 1.56.1 cannot install Chromium on ubuntu 26.04; the profile site moved to 24.04 for the same reason.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install playwright and Chromium
        run: |
          npm install -g playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Tab through every page, and measure the layout at five widths
        run: NODE_PATH="$(npm root -g)" node verification/check_keyboard.js
