name: probe
on:
  push:
    branches: [claude/probe-repositories]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: sudo apt-get install -y -q poppler-utils > /dev/null
      - run: node probe/repositories.js > /tmp/probe-out.txt 2>&1; tail -3 /tmp/probe-out.txt
      # The output goes to a branch of its own, so that it can be read with git instead of from the log.
      - run: |
          git config user.name "probe"
          git config user.email "probe@users.noreply.github.com"
          git checkout --orphan claude/probe-output
          git rm -rq --cached .
          cp /tmp/probe-out.txt out.txt
          git add out.txt
          git commit -qm "probe output"
          git push -f origin claude/probe-output
