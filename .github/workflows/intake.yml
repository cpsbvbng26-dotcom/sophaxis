name: intake
on:
  issues:
    types: [opened, edited, reopened]
  # A co-author confirms, or a researcher vouches, in a comment (Submission Policy); only comments that carry those words run the check again.
  issue_comment:
    types: [created, edited, deleted]
  # The checked intake (from 2026-12-01): once a day, a submission that has not passed every check 30 days after its issue
  # was opened is closed with a fixed comment (tools/intake.js --deadline). A removal or withdrawal issue is never closed.
  schedule:
    - cron: '17 0 * * *'
permissions:
  contents: read
  issues: write
concurrency:
  group: intake-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  intake:
    if: >-
      contains(github.event.issue.labels.*.name, 'submission')
      && (github.event_name == 'issues'
        || (!github.event.issue.pull_request && github.event.comment.user.type != 'Bot'
          && (contains(github.event.comment.body, 'I agree to the listing of this work on Sophaxis') || contains(github.event.comment.body, 'Confirmed by email through the ORCID record') || contains(github.event.comment.body, 'I vouch for this submission to Sophaxis'))))
    name: Look up the DOI and check the submitter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # deposit-check reads the DOI metadata and gives advice in the comment. It is pinned to a commit, and it does not decide the listing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cpsbvbng26-dotcom/deposit-check
          ref: 780899e3ae97a4330e037ba8096fac7178066f69
          path: deposit-check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # poppler-utils reads the shape of the PDF for the moderator. If it cannot be installed, the comment says the shape was not read.
      - run: sudo apt-get install -y -qq --no-install-recommends poppler-utils || echo 'poppler-utils could not be installed'
      # The script reads the issue from the event file (GITHUB_EVENT_PATH), never from the environment or the shell: the run's log prints a step's environment, and would keep the issue text after the issue is emptied.
      - run: node tools/intake.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  withdrawal:
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'withdrawal')
    name: Check that an author asks for withdrawal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The script reads the issue from the event file (GITHUB_EVENT_PATH), never from the environment or the shell: the run's log prints a step's environment, and would keep the issue text after the issue is emptied.
      - run: node tools/withdraw.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  published:
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'published')
    name: Check a reported published version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The script reads the issue from the event file (GITHUB_EVENT_PATH), never from the environment or the shell: the run's log prints a step's environment, and would keep the issue text after the issue is emptied.
      - run: node tools/published.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  deadline:
    if: github.event_name == 'schedule'
    name: Close submissions whose time to pass the checks has ended
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node tools/intake.js --deadline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
