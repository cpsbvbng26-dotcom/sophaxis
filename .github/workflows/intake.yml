name: intake
on:
  issues:
    types: [opened, edited, reopened]
  # A co-author confirms in a comment (Submission Policy); only comments that carry the words of a confirmation run the check again.
  issue_comment:
    types: [created, edited, deleted]
permissions:
  contents: read
  issues: write
concurrency:
  group: intake-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  intake:
    if: >-
      contains(github.event.issue.labels.*.name, 'submission')
      && (github.event_name == 'issues'
        || (!github.event.issue.pull_request && github.event.comment.user.type != 'Bot'
          && (contains(github.event.comment.body, 'I agree to the listing of this work on Sophaxis') || contains(github.event.comment.body, 'Confirmed by email through the ORCID record'))))
    name: Look up the DOI and check the submitter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # deposit-check reads the DOI metadata and gives advice in the comment. It is pinned to a commit, and it does not decide the listing.
      - uses: actions/checkout@v4
        with:
          repository: cpsbvbng26-dotcom/deposit-check
          ref: 780899e3ae97a4330e037ba8096fac7178066f69
          path: deposit-check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The issue text reaches the script only through the environment, never through the shell.
      - run: node tools/intake.js
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  withdrawal:
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'withdrawal')
    name: Check that an author asks for withdrawal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The issue text reaches the script only through the environment, never through the shell.
      - run: node tools/withdraw.js
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  published:
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'published')
    name: Check a reported published version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The issue text reaches the script only through the environment, never through the shell.
      - run: node tools/published.js
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
