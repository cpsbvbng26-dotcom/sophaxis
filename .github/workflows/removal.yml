name: removal
# Removal requests under the Takedown Policy (tools/removal.js).
# An issue is acknowledged at once; a report of exposed personal data takes the abstract and the PDF copy offline at once.
# The decision is the operator's: only the repository owner's labels "upheld" and "not-upheld" act on a record.
# The same label on a verified withdrawal issue that asks for removal removes the record (Withdrawal Policy).
# A request sent by email is handled by running this workflow by hand.
# One change to main at a time, with record.yml (2026-11-15): the concurrency is set on each job that writes, never on the
# workflow, so that a run whose jobs are all skipped (a label on another issue, say) never takes the place of one that writes;
# and a skipped job gets a group of its own. A request whose run did not happen is taken up by the daily sweep.
# The checkouts keep no token: removal.js pushes with the token given to it, and builds and checks the site (which reads the
# PDF copies) with an environment that holds no token (2026-11-15).
on:
  issues:
    types: [opened, edited, reopened, labeled]
  workflow_dispatch:
    inputs:
      id:
        description: Record id, such as 2026.0001
        required: true
      action:
        description: hold (offline while reviewed), release (not upheld, put back), remove (upheld), remove-pdf (an author asks), no-archive (an author withdraws consent to the Internet Archive)
        required: true
        type: choice
        options: [hold, release, remove, remove-pdf, no-archive]
      grounds:
        description: The grounds of the decision, without personal data (needed for remove, remove-pdf and no-archive; the authors receive them in their submission issue)
        required: false
  schedule:
    - cron: '17 0 * * *'
permissions:
  contents: read
jobs:
  intake:
    if: github.event_name == 'issues' && github.event.action != 'labeled' && contains(github.event.issue.labels.*.name, 'removal')
    name: Acknowledge the request, and take personal data offline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    concurrency:
      group: ${{ (github.event_name == 'issues' && github.event.action != 'labeled' && contains(github.event.issue.labels.*.name, 'removal')) && 'removal' || format('removal-skipped-{0}', github.run_id) }}
      cancel-in-progress: false
    outputs:
      before: ${{ steps.removal.outputs.before }}
    steps:
      # The checks read the git history: the ids, the first commit and the changelog.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The script reads the issue from the event file (GITHUB_EVENT_PATH), never from the environment or the shell: the run's log prints a step's environment, and would keep the issue text after the issue is emptied.
      - id: removal
        run: node tools/removal.js
        env:
          MODE: intake
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  decide:
    if: >-
      github.event_name == 'issues' && github.event.action == 'labeled'
      && (contains(github.event.issue.labels.*.name, 'removal') || contains(github.event.issue.labels.*.name, 'withdrawal'))
      && (github.event.label.name == 'upheld' || github.event.label.name == 'not-upheld')
      && github.event.sender.login == github.repository_owner
    name: Carry out the operator's decision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    concurrency:
      group: ${{ (github.event_name == 'issues' && github.event.action == 'labeled' && (contains(github.event.issue.labels.*.name, 'removal') || contains(github.event.issue.labels.*.name, 'withdrawal')) && (github.event.label.name == 'upheld' || github.event.label.name == 'not-upheld') && github.event.sender.login == github.repository_owner) && 'removal' || format('removal-skipped-{0}', github.run_id) }}
      cancel-in-progress: false
    outputs:
      before: ${{ steps.removal.outputs.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The script reads the issue from the event file (GITHUB_EVENT_PATH), never from the environment, which the run's log prints.
      - id: removal
        run: node tools/removal.js
        env:
          MODE: decide
          DECISION: ${{ github.event.label.name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  manual:
    if: github.event_name == 'workflow_dispatch'
    name: Act on a request sent by email
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && 'removal' || format('removal-skipped-{0}', github.run_id) }}
      cancel-in-progress: false
    outputs:
      before: ${{ steps.removal.outputs.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The inputs reach the script only through the environment, and removal.js checks the id's form.
      - id: removal
        run: node tools/removal.js
        env:
          MODE: manual
          ID: ${{ inputs.id }}
          ACTION: ${{ inputs.action }}
          GROUNDS: ${{ inputs.grounds }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  remind:
    if: github.event_name == 'schedule'
    name: Take up requests not acknowledged, and remind of requests close to 7 days
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The sweep may take personal data offline, as the intake does, so it writes like the intake.
    permissions:
      contents: write
      issues: write
    concurrency:
      group: ${{ github.event_name == 'schedule' && 'removal' || format('removal-skipped-{0}', github.run_id) }}
      cancel-in-progress: false
    outputs:
      before: ${{ steps.removal.outputs.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Every open removal issue that has no acknowledgement of the bot yet is taken up as if it had just been opened, then the reminders.
      - id: removal
        run: node tools/removal.js
        env:
          MODE: remind
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # A push made by this workflow starts no other workflow, so the search engines are told here (tools/indexnow.js), in a job
  # of its own: a failure to tell them does not make the job that took the record offline fail, and the run still shows it.
  # The heartbeat of cpsbvbng26-dotcom notices when this job keeps failing.
  indexnow:
    needs: [intake, decide, manual, remind]
    if: always() && (needs.intake.outputs.before != '' || needs.decide.outputs.before != '' || needs.manual.outputs.before != '' || needs.remind.outputs.before != '')
    name: Tell IndexNow what changed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # main as it is now, with the history, to compare its sitemap with the one before the first push of the run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node tools/indexnow.js
        env:
          BEFORE: ${{ needs.intake.outputs.before || needs.decide.outputs.before || needs.manual.outputs.before || needs.remind.outputs.before }}
