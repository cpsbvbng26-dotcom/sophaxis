name: watch
# Once a week: every listed DOI still resolves and keeps its licence, every PDF copy keeps its recorded SHA-256 and is read for advice, new versions at Figshare and arXiv are noted, and the pages are saved to the Internet Archive.
on:
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  watch:
    name: Check the listed DOIs and save the pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # poppler-utils reads the PDF copies for the advice of tools/pdf_advice.js. If it cannot be installed, the copies are still compared with their recorded SHA-256.
      - run: sudo apt-get install -y -qq --no-install-recommends poppler-utils || echo 'poppler-utils could not be installed'
      - run: node tools/watch.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
