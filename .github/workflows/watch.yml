name: watch
# Once a week: every listed DOI still resolves and keeps its licence, new versions at Figshare and arXiv are noted, and the pages are saved to the Internet Archive.
on:
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  watch:
    name: Check the listed DOIs and save the pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/watch.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
