name: Submit a preprint
description: List a preprint that you have deposited in Zenodo, Figshare, OSF Preprints, SocArXiv, MetaArXiv, arXiv, Preprints.org, SSRN, Research Square, SciELO Preprints, Qeios, ScienceOpen Preprints, Advance, KC Works or Jxiv.
title: "[Submission] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Your GitHub username and everything you write here will be visible to anyone.
        Acceptance is moderation, not peer review. Read the Submission Policy before submitting: https://sophaxis.vercel.app/policies/submission.html

        Give the DOI and your ORCID iD. The title, the authors, the abstract and the licence are taken from the DOI metadata.
        Before submitting, add `https://github.com/<your username>` under "Websites & social links" in your ORCID record.
        An automatic check then confirms that the account opening this issue belongs to an author of the work.
  - type: input
    id: doi
    attributes:
      label: DOI of the deposited preprint
      description: A DOI from Zenodo (10.5281/zenodo.…), Figshare (10.6084/m9.figshare.…), OSF Preprints (10.31219/osf.io/…), SocArXiv (10.31235/osf.io/…), MetaArXiv (10.31222/osf.io/…), arXiv (10.48550/arXiv.…), Preprints.org (10.20944/preprints…), SSRN (10.2139/ssrn.…), Research Square (10.21203/rs.3.rs-…), SciELO Preprints (10.1590/SciELOPreprints.…), Qeios (10.32388/…), ScienceOpen Preprints (10.14293/PR2199.…), Advance (10.31124/advance.…), KC Works (10.17613/…) or Jxiv (10.51094/jxiv.…). The work must carry CC BY 4.0, CC BY-SA 4.0 or CC0 1.0 in its DOI metadata.
      placeholder: 10.5281/zenodo.0000000
    validations:
      required: true
  - type: input
    id: orcid
    attributes:
      label: Your ORCID iD
      description: Your ORCID record must link to your GitHub account, and the iD must belong to an author of the work.
      placeholder: 0000-0002-1825-0097
    validations:
      required: true
  - type: input
    id: published
    attributes:
      label: DOI of the published version (only if a journal has published the work)
      description: The record links to it. The deposited version must be one that you may share under its licence.
      placeholder: 10.1000/journal.0000
  - type: input
    id: update
    attributes:
      label: Existing Sophaxis id (only for a new version)
      placeholder: 2026.0001
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Philosophy
        - Mathematics
        - Philosophy of Mathematics
        - Philosophy of Science
        - Logic
    validations:
      required: true
  - type: dropdown
    id: others
    attributes:
      label: Other categories (optional)
      description: Fields where the work should also be listed.
      multiple: true
      options:
        - Philosophy
        - Mathematics
        - Philosophy of Mathematics
        - Philosophy of Science
        - Logic
  - type: textarea
    id: abstract
    attributes:
      label: Abstract (only if the DOI metadata has none)
      description: Leave this empty if the repository already holds the abstract.
  - type: textarea
    id: llm
    attributes:
      label: Use of language models and other generative models
      description: Name the tools and say what they were used for (drafting, translation, proofs, code, literature search, editing, figures, images). This covers every generative model, not only language models. If none were used, say so.
      placeholder: |
        Examples:
        None were used.
        ChatGPT (OpenAI) translated the first draft from Japanese into English; the author revised every sentence.
        Claude (Anthropic) wrote the code in the appendix and suggested literature; the author checked each reference.
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      options:
        - label: I am an author of this work.
          required: true
        - label: Every author of this work agrees to its listing on Sophaxis.
          required: true
        - label: The authors may share this version under its licence; if a journal has published the work, the publisher allows it.
          required: true
        - label: The work contains no material that the authors may not share, and no personal data of third parties.
          required: true
        - label: The authors bear full responsibility for the work and its listing, as the Terms of Use set out.
          required: true
        - label: I understand that listing is moderation, not peer review.
          required: true
