name: Submit a preprint
description: List a preprint that you have deposited in Zenodo, Figshare, OSF Preprints, SocArXiv, MetaArXiv, arXiv, Preprints.org, SSRN, Research Square, SciELO Preprints, Qeios, ScienceOpen Preprints, Advance, KC Works or Jxiv.
title: "[Submission] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Your GitHub username and everything you write here will be visible to anyone.
        Acceptance is moderation, not peer review. Read the Submission Policy before submitting: https://sophaxis.vercel.app/policies/submission.html

        Give the DOI and your ORCID iD. The title, the authors, the abstract and the licence are taken from the DOI metadata.
        Before submitting, add `https://github.com/<your username>` under "Websites & social links" in your ORCID record.
        An automatic check then confirms that the account opening this issue belongs to an author of the work.
        Personal data given here is used only for the purposes in the Privacy Policy: https://sophaxis.vercel.app/policies/privacy.html
        Anyone can object, at any time, to the use of their personal data on Sophaxis, on grounds of their own situation, by the removal form or by email.
  - type: input
    id: doi
    attributes:
      label: DOI of the deposited preprint
      description: A DOI from Zenodo (10.5281/zenodo.…), Figshare (10.6084/m9.figshare.…), OSF Preprints (10.31219/osf.io/…), SocArXiv (10.31235/osf.io/…), MetaArXiv (10.31222/osf.io/…), arXiv (10.48550/arXiv.…), Preprints.org (10.20944/preprints…), SSRN (10.2139/ssrn.…), Research Square (10.21203/rs.3.rs-…), SciELO Preprints (10.1590/SciELOPreprints.…), Qeios (10.32388/…), ScienceOpen Preprints (10.14293/PR2199.…), Advance (10.31124/advance.…), KC Works (10.17613/…) or Jxiv (10.51094/jxiv.…). The work must carry CC BY 4.0, CC BY-SA 4.0 or CC0 1.0 in its DOI metadata.
      placeholder: 10.5281/zenodo.0000000
    validations:
      required: true
  - type: input
    id: orcid
    attributes:
      label: Your ORCID iD
      description: Your ORCID record must link to your GitHub account, and the iD must belong to an author of the work.
      placeholder: 0000-0002-1825-0097
    validations:
      required: true
  - type: input
    id: published
    attributes:
      label: DOI of the published version (only if a journal has published the work)
      description: The record links to it. The deposited version must be one that you may share under its licence.
      placeholder: 10.1000/journal.0000
  - type: dropdown
    id: peer
    attributes:
      label: Was the published version peer-reviewed?
      description: Only if you gave a published version above. Sophaxis repeats your answer as your statement.
      options:
        - Yes, the journal or the publisher peer-reviewed it
        - No, it was not peer-reviewed
        - I do not know
  - type: input
    id: update
    attributes:
      label: Existing Sophaxis id (only for a new version)
      placeholder: 2026.0001
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Philosophy
        - Mathematics
        - Philosophy of Mathematics
        - Philosophy of Science
        - Logic
    validations:
      required: true
  - type: dropdown
    id: others
    attributes:
      label: Other categories (optional)
      description: Fields where the work should also be listed.
      multiple: true
      options:
        - Philosophy
        - Mathematics
        - Philosophy of Mathematics
        - Philosophy of Science
        - Logic
  - type: textarea
    id: abstract
    attributes:
      label: Abstract (only if the DOI metadata has none)
      description: Leave this empty if the repository already holds the abstract.
  - type: textarea
    id: llm
    attributes:
      label: Use of language models and other generative models
      description: Name the tools and say what they were used for (drafting, translation, proofs, code, literature search, editing, figures, images). This covers every generative model, not only language models. If none were used, say so.
      placeholder: |
        Examples:
        None were used.
        ChatGPT (OpenAI) translated the first draft from Japanese into English; the author revised every sentence.
        Claude (Anthropic) wrote the code in the appendix and suggested literature; the author checked each reference.
    validations:
      required: true
  - type: dropdown
    id: llm_extent
    attributes:
      label: Extent of use of generative models
      description: Choose the highest level that applies. The statement above says which tools did what. Required from 2026-11-21.
      options:
        - "None: no generative model was used"
        - "Editing: language editing, translation or proofreading only"
        - "Assistance: structure, literature search or checking; the authors wrote the text"
        - "Drafting: a generative model drafted text, proofs, code or figures that the authors revised"
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      options:
        - label: I am an author of this work.
          required: true
        - label: Every author of this work agrees to its listing on Sophaxis.
          required: true
        - label: The authors may share this version under its licence; if a journal has published the work, the publisher allows it.
          required: true
        - label: The work contains no material that the authors may not share, and no personal data of third parties.
          required: true
        - label: The authors bear full responsibility for the work and its listing, as the Terms of Use set out.
          required: true
        - label: I understand that listing is moderation, not peer review.
          required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Consent and agreement
      description: Required from 2026-11-21. The Privacy Policy, under "Services outside Japan", gives the information on these services and their countries. Any author can withdraw this consent at any time, by the removal form or by email; the record is then removed, and what was done before stays lawful.
      options:
        - label: Every author consents to the record being published, offered through OAI-PMH, and provided to GitHub, Vercel and ORCID in the United States, and to the public parts of this submission being given, for help with the review, to Anthropic, OpenAI and xAI in the United States, as the Privacy Policy (https://sophaxis.vercel.app/policies/privacy.html) sets out.
          required: false
        - label: I have read and agree to the Terms of Use and the other policies (https://sophaxis.vercel.app/policies/terms.html), in their version on the day of submission.
          required: false
        - label: I am 13 or older, and if I am under 18, a parent or guardian consents to this submission.
          required: false
  - type: checkboxes
    id: archive
    attributes:
      label: Saving to the Internet Archive (optional)
      description: Sophaxis saves its pages and PDF copies to the Internet Archive in the United States, so that they stay readable. This is a separate consent and may be left empty; the work is listed either way. The Privacy Policy, under "People in the European Union and the United Kingdom" and "Services outside Japan", gives the possible risks. Any author can withdraw it at any time, and the saves then stop without review.
      options:
        - label: Every author consents to the record page and the PDF copies being saved to the Internet Archive in the United States.
          required: false
  - type: checkboxes
    id: residence
    attributes:
      label: Where the authors live
      description: Required from 2026-11-22. Sophaxis does not list work by an author who lives in any of these places, or who stays in one between the submission and the listing, even briefly (the European Union, the European Economic Area, the United Kingdom, China, Thailand, Russia, Türkiye, Egypt, Peru, Albania, Monaco, Guernsey, Botswana, Ecuador, Iraq, Indonesia, Rwanda, Zambia, Ethiopia, the Democratic Republic of the Congo, Kazakhstan, Tunisia, Uganda, Guinea, Madagascar, Bolivia, Costa Rica and Quebec). This depends only on where an author lives or stays, not on nationality or race; the reason is that a law there requires, or is reported to require, a representative, local storage of personal data, registration there, or conditions before data leaves the place, which Sophaxis does not meet. The Submission Policy gives the law of each. A work by an author under 18 who lives or stays in India is not listed either, because India's law requires a verified consent of a parent that Sophaxis does not check.
      options:
        - label: No author of this work lives in any of the places listed above, or stays in one between the submission and the listing, even briefly (such as for travel, work or study), and no author under 18 lives or stays in India.
          required: false
