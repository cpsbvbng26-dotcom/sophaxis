name: Submit a preprint
description: List a preprint that you have deposited in Zenodo, Figshare, OSF Preprints, SocArXiv, MetaArXiv, arXiv, Preprints.org, SSRN, Research Square, SciELO Preprints, Qeios, ScienceOpen Preprints, Advance, KC Works or Jxiv.
title: "[Submission] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Your GitHub username and everything you write here will be visible to anyone.
        Acceptance is moderation, not peer review. Read the Submission Policy before submitting: https://sophaxis.vercel.app/policies/submission.html

        Give the DOI and your ORCID iD. The title, the authors, the abstract and the licence are taken from the DOI metadata.
        Before submitting, add `https://github.com/<your username>` under "Websites & social links" in your ORCID record.
        An automatic check then confirms that the account opening this issue belongs to an author of the work.
        Personal data given here is used only for the purposes in the Privacy Policy: https://sophaxis.vercel.app/policies/privacy.html
        Anyone can object, at any time, to the use of their personal data on Sophaxis, on grounds of their own situation, by the removal form or by email.
  - type: input
    id: doi
    attributes:
      label: DOI of the deposited preprint
      description: A DOI from Zenodo (10.5281/zenodo.…), Figshare (10.6084/m9.figshare.…), OSF Preprints (10.31219/osf.io/…), SocArXiv (10.31235/osf.io/…), MetaArXiv (10.31222/osf.io/…), arXiv (10.48550/arXiv.…), Preprints.org (10.20944/preprints…), SSRN (10.2139/ssrn.…), Research Square (10.21203/rs.3.rs-…), SciELO Preprints (10.1590/SciELOPreprints.…), Qeios (10.32388/…), ScienceOpen Preprints (10.14293/PR2199.…), Advance (10.31124/advance.…), KC Works (10.17613/…) or Jxiv (10.51094/jxiv.…). The work must carry CC BY 4.0, CC BY-SA 4.0 or CC0 1.0 in its DOI metadata. From 2026-11-23, at least six months must have passed since the first DOI of the work was registered. From the same day, a first submission needs a researcher to vouch for it (see the Submission Policy).
      placeholder: 10.5281/zenodo.0000000
    validations:
      required: true
  - type: input
    id: orcid
    attributes:
      label: Your ORCID iD
      description: Your ORCID record must link to your GitHub account, and the iD must belong to an author of the work.
      placeholder: 0000-0002-1825-0097
    validations:
      required: true
  - type: input
    id: published
    attributes:
      label: DOI of the published version (only if a journal has published the work)
      description: The record links to it. The deposited version must be one that you may share under its licence.
      placeholder: 10.1000/journal.0000
  - type: dropdown
    id: peer
    attributes:
      label: Was the published version peer-reviewed?
      description: Only if you gave a published version above. Sophaxis repeats your answer as your statement.
      options:
        - Yes, the journal or the publisher peer-reviewed it
        - No, it was not peer-reviewed
        - I do not know
  - type: input
    id: update
    attributes:
      label: Existing Sophaxis id (only for a new version)
      placeholder: 2026.0001
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Philosophy
        - Mathematics
        - Philosophy of Mathematics
        - Philosophy of Science
        - Logic
    validations:
      required: true
  - type: dropdown
    id: others
    attributes:
      label: Other categories (optional)
      description: Fields where the work should also be listed.
      multiple: true
      options:
        - Philosophy
        - Mathematics
        - Philosophy of Mathematics
        - Philosophy of Science
        - Logic
  - type: dropdown
    id: subfield
    attributes:
      label: Subfield (optional)
      description: One subfield within the category chosen above, if one fits.
      options:
        - "Philosophy: Ethics"
        - "Philosophy: Political philosophy"
        - "Philosophy: Epistemology"
        - "Philosophy: Metaphysics"
        - "Philosophy: Philosophy of mind"
        - "Philosophy: Philosophy of language"
        - "Philosophy: Aesthetics"
        - "Philosophy: Philosophy of religion"
        - "Philosophy: History of philosophy"
        - "Philosophy: Asian and comparative philosophy"
        - "Mathematics: Algebra"
        - "Mathematics: Analysis"
        - "Mathematics: Geometry and topology"
        - "Mathematics: Number theory"
        - "Mathematics: Combinatorics"
        - "Mathematics: Probability and statistics"
        - "Mathematics: Game theory"
        - "Mathematics: Applied mathematics"
        - "Logic: Proof theory"
        - "Logic: Model theory"
        - "Logic: Set theory"
        - "Logic: Computability"
        - "Logic: Philosophical logic"
        - "Philosophy of Science: Philosophy of physics"
        - "Philosophy of Science: Philosophy of biology"
        - "Philosophy of Science: Philosophy of the social sciences"
        - "Philosophy of Science: Philosophy of technology"
  - type: textarea
    id: abstract
    attributes:
      label: Abstract (only if the DOI metadata has none)
      description: Leave this empty if the repository already holds the abstract.
  - type: input
    id: abstract_other_lang
    attributes:
      label: Language of the second abstract (optional)
      description: "If you give the abstract in a second language below, its two- or three-letter code (ISO 639), for example: ja, de, fr."
  - type: textarea
    id: abstract_other
    attributes:
      label: Abstract in a second language (optional)
      description: An abstract in a language other than that of the abstract above, written or checked by the authors. It is shown as given; Sophaxis does not check the translation.
  - type: textarea
    id: lay_summary
    attributes:
      label: Summary in plain words (optional)
      description: At most three sentences and 600 characters, for readers outside the field. It is shown on the record page as the authors' own summary, and is not part of the work.
  - type: textarea
    id: llm
    attributes:
      label: Use of language models and other generative models
      description: Name the tools and say what they were used for (drafting, translation, proofs, code, literature search, editing, figures, images). This covers every generative model, not only language models. If none were used, say so.
      placeholder: |
        Examples:
        None were used.
        ChatGPT (OpenAI) translated the first draft from Japanese into English; the author revised every sentence.
        Claude (Anthropic) wrote the code in the appendix and suggested literature; the author checked each reference.
    validations:
      required: true
  - type: dropdown
    id: llm_extent
    attributes:
      label: Extent of use of generative models
      description: Choose the highest level that applies. The statement above says which tools did what. Required from 2026-11-21.
      options:
        - "None: no generative model was used"
        - "Editing: language editing, translation or proofreading only"
        - "Assistance: structure, literature search or checking; the authors wrote the text"
        - "Drafting: a generative model drafted text, proofs, code or figures that the authors revised"
    validations:
      required: false
  - type: textarea
    id: funding
    attributes:
      label: Funding
      description: Required from 2026-11-24. Name every funder of the work, with grant numbers, or say that the work had no funding.
      placeholder: |
        Examples:
        The work had no funding.
        JSPS KAKENHI Grant Number JP00K00000.
    validations:
      required: false
  - type: textarea
    id: competing_interests
    attributes:
      label: Competing interests
      description: Required from 2026-11-24. Any financial or personal interest of an author that bears on the work, or say that there is none.
      placeholder: |
        Examples:
        The authors have no competing interests.
    validations:
      required: false
  - type: textarea
    id: ethics
    attributes:
      label: Human participants and research ethics
      description: Required from 2026-11-24. Say whether the work involves human participants, such as surveys, interviews or experiments with people. If it does, name the ethics committee that approved it, or say why no approval was needed under the rules that applied, and confirm that every participant who can be identified consented.
      placeholder: |
        Examples:
        The work involves no human participants.
        The survey was approved by the ethics committee of the University of X (approval 2026-01); every participant consented in writing.
    validations:
      required: false
  - type: textarea
    id: data
    attributes:
      label: Data and code (optional)
      description: Where the data, code and other materials on which the work rests can be found, such as a repository with a DOI, or that there are none.
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      options:
        - label: "I confirm that I am an author of this work."
          required: true
        - label: "I confirm that the ORCID iD given in this form is my own."
          required: true
        - label: "I confirm that every author of this work agrees to this submission and to its listing on Sophaxis."
          required: true
        - label: "I confirm that the licence given in the DOI metadata applies to the deposited version."
          required: true
        - label: "I confirm that the authors have the right to share this version under that licence, and that, if a journal has published the work, the publisher allows it."
          required: true
        - label: "I confirm that the work contains no material, such as figures or long quotations, that the authors may not share."
          required: true
        - label: "I confirm that the work contains no personal data of third parties."
          required: true
        - label: "I confirm that the statement on generative models is complete and true."
          required: true
        - label: "I confirm that, from 2026-11-24, the statements on funding, competing interests, and human participants and research ethics are complete and true."
          required: true
        - label: "I confirm that everything else I state in this form is true."
          required: true
        - label: "I agree that the authors bear full responsibility for the work and its listing, as the [Terms of Use](https://sophaxis.vercel.app/policies/terms.html#the-authors-bear-full-responsibility) set out."
          required: true
        - label: "I agree that a listing is moderation, not peer review, and that it is not to be presented as peer review ([Moderation Policy](https://sophaxis.vercel.app/policies/moderation.html#moderation-is-not-peer-review))."
          required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Consent and agreement
      description: Required from 2026-11-21. The Privacy Policy, under "Services outside Japan", gives the information on these services and their countries. These services may not be required to protect personal data in a way that, overall, provides safeguards comparable to those of the law of the place where an author lives, such as New Zealand's Privacy Act 2020. Any author can withdraw this consent at any time, by the removal form or by email; the record is then removed, and what was done before stays lawful.
      options:
        - label: "I confirm that every author consents to the record being published and offered through OAI-PMH."
          required: false
        - label: "I confirm that every author consents to the record being provided to GitHub, Vercel and ORCID in the United States, as the [Privacy Policy](https://sophaxis.vercel.app/policies/privacy.html#services-outside-japan) sets out."
          required: false
        - label: "I confirm that every author consents to the public parts of this submission being given, for help with the review, to Anthropic, OpenAI and xAI in the United States, as the [Privacy Policy](https://sophaxis.vercel.app/policies/privacy.html#services-outside-japan) sets out."
          required: false
        - label: "I agree to the [Terms of Use](https://sophaxis.vercel.app/policies/terms.html), in their version on the day of submission."
          required: false
        - label: "I agree to the settlement of disputes, and to the court named, under [Disputes](https://sophaxis.vercel.app/policies/terms.html#disputes) in the Terms of Use."
          required: false
        - label: "I agree that Sophaxis gives no warranty, as [No warranty](https://sophaxis.vercel.app/policies/terms.html#no-warranty) in the Terms of Use sets out."
          required: false
        - label: "I agree to the [Privacy Policy](https://sophaxis.vercel.app/policies/privacy.html)."
          required: false
        - label: "I agree to the [Submission Policy](https://sophaxis.vercel.app/policies/submission.html)."
          required: false
        - label: "I agree to the [Moderation Policy](https://sophaxis.vercel.app/policies/moderation.html), including how a decision can be challenged under [Decisions](https://sophaxis.vercel.app/policies/moderation.html#decisions)."
          required: false
        - label: "I agree to the [Takedown Policy](https://sophaxis.vercel.app/policies/takedown.html)."
          required: false
        - label: "I agree to the [Copyright Policy](https://sophaxis.vercel.app/policies/copyright.html)."
          required: false
        - label: "I agree to the [Licence Policy](https://sophaxis.vercel.app/policies/licences.html)."
          required: false
        - label: "I agree to the [Withdrawal Policy](https://sophaxis.vercel.app/policies/withdrawal.html)."
          required: false
        - label: "I confirm that I am 13 or older, as from 2026-11-21 a person under 13 cannot submit ([Terms of Use](https://sophaxis.vercel.app/policies/terms.html#general))."
          required: false
        - label: "I confirm that, if I am under 18, I submit only with the consent of a parent or guardian."
          required: false
  - type: checkboxes
    id: archive
    attributes:
      label: Saving to the Internet Archive (optional)
      description: Sophaxis saves its pages and PDF copies to the Internet Archive in the United States, so that they stay readable. This is a separate consent and may be left empty; the work is listed either way. The Privacy Policy, under "People in the European Union and the United Kingdom" and "Services outside Japan", gives the possible risks. Any author can withdraw it at any time, and the saves then stop without review.
      options:
        - label: "I confirm that every author consents to the record page and the PDF copies being saved to the Internet Archive in the United States."
          required: false
  - type: checkboxes
    id: residence
    attributes:
      label: Where the authors live
      description: Required from 2026-11-22. Sophaxis does not list work by an author who lives in any of these places, or who stays in one between the submission and the listing, even briefly (the European Union, the European Economic Area, the United Kingdom, China, Thailand, Russia, Türkiye, Egypt, Peru, Albania, Monaco, Guernsey, Botswana, Ecuador, Iraq, Indonesia, Rwanda, Zambia, Ethiopia, the Democratic Republic of the Congo, Kazakhstan, Tunisia, Uganda, Guinea, Madagascar, Bolivia, Costa Rica and Quebec; and, from 2026-11-26, Argentina, Colombia, Ghana, Korea, Mexico, the Philippines, Saudi Arabia, Uruguay, Zimbabwe, Kenya, Tanzania, South Africa, Singapore, the United Arab Emirates and Qatar). This depends only on where an author lives or stays, not on nationality or race; the reason is that a law there requires, or is reported to require, a representative, local storage of personal data, registration there, or conditions before data leaves the place, which Sophaxis does not meet; from 2026-11-26 the reasons also include a postal address or telephone number of the operator given before data is collected, a confirmed consent of a parent for a minor, and a data protection law that could not be read at its source. The Submission Policy gives the law of each. A work by an author under 18 who lives or stays in India is not listed either, because India's law requires a verified consent of a parent that Sophaxis does not check. The submitter confirms what holds on the day of submission, and reports a change learnt of before the listing. From 2026-12-01, the checked intake also checks that the public records of every author whose identity it verifies place them where Sophaxis is offered (Submission Policy, "Where the authors live").
      options:
        - label: "I confirm that, on the day of submission, no author of this work lives in any of the places listed above, or is staying in one, even briefly (such as for travel, work or study)."
          required: false
        - label: "I confirm that no author under 18 lives or stays in India."
          required: false
        - label: "I agree to report in this issue, before the listing, any change to these two confirmations that I learn of, from 2026-12-01."
          required: false
