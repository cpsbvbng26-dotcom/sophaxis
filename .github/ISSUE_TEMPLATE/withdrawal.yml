name: Withdraw a work
description: Withdraw a listed work, as one of its authors, under the Withdrawal Policy.
title: "[Withdrawal] "
labels: ["withdrawal"]
body:
  - type: markdown
    attributes:
      value: |
        Read the Withdrawal Policy first: https://sophaxis.vercel.app/policies/withdrawal.html

        This issue is public. Any one author can withdraw a listed work. The record page stays, with a withdrawal notice, so that citations do not break; the PDF copies are taken off the site.
        Open this issue from your own GitHub account. As at submission, your ORCID record must link to it, and an automatic check confirms that your ORCID iD belongs to an author of the work.
        To ask for removal for legal reasons, use the removal form instead.
  - type: input
    id: id
    attributes:
      label: Sophaxis id
      placeholder: 2026.0001
    validations:
      required: true
  - type: input
    id: orcid
    attributes:
      label: Your ORCID iD
      placeholder: 0000-0002-1825-0097
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason, shown on the record page
      description: One or two sentences. Do not include personal data.
      placeholder: The authors found an error in the main proof.
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      options:
        - label: I am an author of this work.
          required: true
        - label: The reason contains no personal data.
          required: true
